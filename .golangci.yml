version: "2"

linters:
  default: standard
  enable:
    - errorlint
    - exptostd
    - fatcontext
    - gocritic
    - godot
    - loggercheck
    - misspell
    - modernize
    - nilnesserr
    - perfsprint
    - predeclared
    - revive
    - sloglint
    - testifylint
    - unconvert
    - usestdlibvars
    - whitespace

formatters:
  enable:
    - gofmt
    - goimports
